# Fork secret-scan configuration (see .github/workflows/fork-guard.yml).
#
# Scope: FORK COMMITS ONLY (fork point 47f9438 .. HEAD). The workflow passes
# --log-opts so upstream history is never scanned; this config therefore
# carries the plain default rule set with no allowlists. Anything the
# default rules flag in a fork commit fails CI — if a fork commit ever
# legitimately needs an exception, add a narrowly-scoped allowlist here with
# the justification in the description.
[extend]
useDefault = true
