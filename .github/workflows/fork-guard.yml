# Fork guard: secret-scan the FORK's own commits with gitleaks.
#
# Scope is deliberately narrow: only commits made in this fork (fork point
# FORK_POINT .. HEAD), never upstream history — upstream's 6k+ commits are
# not ours to police, and their test fixtures trip generic heuristics. The
# pinned gitleaks release runs directly (gitleaks-action needs a license
# key for private repos). A finding in a fork commit fails the job.
#
# If the fork is ever rebased onto a newer upstream master, update FORK_POINT
# to the new merge-base SHA in the same commit.
name: fork-guard

on:
  push:
    branches: [master]
  pull_request:

env:
  FORK_POINT: 47f943859bef60e4160492346772ded9b24f765a

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # An invalid FORK_POINT makes git log-opts resolve to an empty range,
      # and gitleaks exits 0 having scanned nothing. Fail loud before that.
      - name: Verify fork-point resolves to a non-empty range
        run: |
          git rev-parse --verify "${FORK_POINT}^{commit}"
          COUNT=$(git rev-list --count "$FORK_POINT..HEAD")
          echo "fork commits to scan: $COUNT"
          test "$COUNT" -gt 0

      - name: Install gitleaks 8.30.1
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan fork commits for secrets
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --log-opts="$FORK_POINT..HEAD"
