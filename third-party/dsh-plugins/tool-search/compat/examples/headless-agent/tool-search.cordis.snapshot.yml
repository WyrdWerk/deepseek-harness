- id: tool-search-mock
  name: './tests/fixtures/tool-search-driver.ts'

- id: base
  name: '@cordisjs/plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: cli-agent
        config:
          provider: tool-search-mock
          model: tool-search-mock
          persistenceRoot: './.sessions'
          workspaceContext: false
          skills: { enabled: false }
          toolBash: false
          toolTasks: false
          persona: 'Keyless tool-search snapshot.'

- id: tool-search
  name: '@deepseek-ai/dsh-tool-search'
  config:
    alwaysVisible: [todo_write]
    maxResults: 1

- id: tool-search-invariant
  name: '@deepseek-ai/dsh-tool-search/invariant'
